name: "${PROJECT_NAME}-${DEPLOYMENT_SLOT}"

services:
  app:
    image: "${APPLICATION_IMAGE}"
    expose:
      - "${APPLICATION_PORT}"
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - "${PROJECT_NAME}-${DEPLOYMENT_SLOT}-app"

networks:
  edge:
    external: true
    name: "${DEPLOY_NETWORK}"
