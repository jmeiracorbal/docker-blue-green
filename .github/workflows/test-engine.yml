name: Test deployment engine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/bluegreen

  integration:
    runs-on: ubuntu-latest
    env:
      BLUEGREEN_DOCKER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v -timeout 8m ./internal/deploy -run '^TestLiveBlueGreen$'

  remote-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test the standalone fixture application
        working-directory: examples/remote-e2e/app
        run: go test -race ./...
      - name: Validate the deployment contract
        run: go run ./cmd/bluegreen config check --dir examples/remote-e2e
      - name: Validate Docker Compose manifests
        run: |
          docker compose --env-file examples/remote-e2e/.env.example \
            -f examples/remote-e2e/deploy/compose.yml config --quiet
          docker compose --env-file examples/remote-e2e/.env.example \
            -f examples/remote-e2e/deploy/infrastructure/compose.yml config --quiet
      - name: Build OCI fixture image
        run: docker build -t bluegreen-remote-e2e:verify examples/remote-e2e/app

  ssh-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install isolated SSH test server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
      - name: Exercise OCI, SSH, Caddy, lifecycle and rollback
        run: bash ./scripts/test-ssh-e2e.sh
