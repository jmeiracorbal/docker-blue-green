name: Publish OCI images

on:
  workflow_call:
    inputs:
      version:
        description: Release version to publish as a container image tag
        type: string
        required: true
      source_ref:
        description: Existing Git ref used to build the release
        type: string
        required: true
      engine_ref:
        description: Immutable revision of the Blue-Green configuration engine
        type: string
        required: true
    secrets:
      OCI_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-oci-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      registry_host: ${{ steps.registry.outputs.registry_host }}
      registry_repository: ${{ steps.registry.outputs.registry_repository }}
      registry_username: ${{ steps.registry.outputs.registry_username }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Load OCI registry from the project contract
        id: registry
        env:
          ENGINE_REF: ${{ inputs.engine_ref }}
          IMAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENGINE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$IMAGE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 1
          go install "github.com/jmeiracorbal/docker-blue-green/cmd/bluegreen@$ENGINE_REF"
          "$(go env GOPATH)/bin/bluegreen" config export --dir . > "$RUNNER_TEMP/project.json"
          {
            echo "registry_host=$(jq -er '.registry.host' "$RUNNER_TEMP/project.json")"
            echo "registry_repository=$(jq -er '.registry.repository' "$RUNNER_TEMP/project.json")"
            echo "registry_username=$(jq -er '.registry.username' "$RUNNER_TEMP/project.json")"
          } >> "$GITHUB_OUTPUT"

      - id: images
        name: Discover buildable application services
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml config --format json --no-interpolate --no-path-resolution |
            jq -cer '
              .services
              | to_entries
              | map(select(.value.build != null) | {
                  service: .key,
                  context: (if (.value.build | type) == "string" then .value.build else .value.build.context end),
                  dockerfile: (if (.value.build | type) == "string" then "Dockerfile" else (.value.build.dockerfile // "Dockerfile") end),
                  target: (if (.value.build | type) == "string" then "" else (.value.build.target // "") end)
                })
              | if length == 0 then error("No application services with a build definition were found in deploy/compose.yml") else {include: .} end
            ' > "$RUNNER_TEMP/build-matrix.json"
          while IFS= read -r entry; do
            context=$(jq -r '.context' <<< "$entry")
            dockerfile=$(jq -r '.dockerfile' <<< "$entry")
            [[ -n "$context" && "$context" != "null" && "$context" != /* ]] || exit 1
            [[ -n "$dockerfile" && "$dockerfile" != /* ]] || exit 1
            absolute_context=$(realpath -m "$GITHUB_WORKSPACE/deploy/$context")
            absolute_dockerfile=$(realpath -m "$absolute_context/$dockerfile")
            [[ "$absolute_context" == "$GITHUB_WORKSPACE/"* ]] || exit 1
            [[ "$absolute_dockerfile" == "$GITHUB_WORKSPACE/"* ]] || exit 1
            [[ -d "$absolute_context" && -f "$absolute_dockerfile" ]] || exit 1
          done < <(jq -c '.include[]' "$RUNNER_TEMP/build-matrix.json")
          echo "matrix=$(cat "$RUNNER_TEMP/build-matrix.json")" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.discover.outputs.registry_host }}
          username: ${{ needs.discover.outputs.registry_username }}
          password: ${{ secrets.OCI_REGISTRY_TOKEN }}

      - name: Build and publish versioned image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/${{ matrix.context }}
          file: ./deploy/${{ matrix.context }}/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.discover.outputs.registry_host }}/${{ needs.discover.outputs.registry_repository }}-${{ matrix.service }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record image digest
        env:
          OCI_REGISTRY_HOST: ${{ needs.discover.outputs.registry_host }}
          OCI_REGISTRY_REPOSITORY: ${{ needs.discover.outputs.registry_repository }}
          IMAGE_SERVICE: ${{ matrix.service }}
          IMAGE_VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg service "$IMAGE_SERVICE" \
                --arg tag "$OCI_REGISTRY_HOST/$OCI_REGISTRY_REPOSITORY-$IMAGE_SERVICE:$IMAGE_VERSION" \
                --arg digest "$OCI_REGISTRY_HOST/$OCI_REGISTRY_REPOSITORY-$IMAGE_SERVICE@$IMAGE_DIGEST" \
                '{service: $service, tag: $tag, image: $digest}' > "$RUNNER_TEMP/image.json"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.json
          if-no-files-found: error
          retention-days: 30
