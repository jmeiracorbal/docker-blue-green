name: Publish OCI images

on:
  workflow_call:
    inputs:
      image_prefix:
        description: Full OCI image prefix, including registry host and repository path
        type: string
        required: true
      push_username:
        description: Username authorized to push to the configured OCI registry
        type: string
        required: true
      version:
        description: Release version to publish as a container image tag
        type: string
        required: true
      source_ref:
        description: Existing Git ref used to build the release
        type: string
        required: true
    secrets:
      GIT_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-oci-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      registry_host: ${{ steps.registry.outputs.registry_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Validate OCI image destination and version
        id: registry
        env:
          OCI_IMAGE_PREFIX: ${{ inputs.image_prefix }}
          OCI_PUSH_USERNAME: ${{ inputs.push_username }}
          IMAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OCI_IMAGE_PREFIX" =~ ^[a-z0-9][a-z0-9.:-]*/[a-z0-9][a-z0-9/_.-]*$ && "$OCI_IMAGE_PREFIX" != *"//"* ]] || { echo "A full OCI image prefix with explicit registry host and repository is required" >&2; exit 1; }
          [[ -n "$OCI_PUSH_USERNAME" ]] || { echo "OCI push username is required" >&2; exit 1; }
          echo "registry_host=${OCI_IMAGE_PREFIX%%/*}" >> "$GITHUB_OUTPUT"
          [[ "$IMAGE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Invalid OCI image version" >&2; exit 1; }

      - id: images
        name: Discover buildable application services
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml config --format json --no-interpolate --no-path-resolution |
            jq -cer '
              .services
              | to_entries
              | map(select(.value.build != null) | {
                  service: .key,
                  context: (if (.value.build | type) == "string" then .value.build else .value.build.context end),
                  dockerfile: (if (.value.build | type) == "string" then "Dockerfile" else (.value.build.dockerfile // "Dockerfile") end),
                  target: (if (.value.build | type) == "string" then "" else (.value.build.target // "") end)
                })
              | if length == 0 then error("No application services with a build definition were found in deploy/compose.yml") else {include: .} end
            ' > "$RUNNER_TEMP/build-matrix.json"
          while IFS= read -r entry; do
            context=$(jq -r '.context' <<< "$entry")
            dockerfile=$(jq -r '.dockerfile' <<< "$entry")
            [[ -n "$context" && "$context" != "null" && "$context" != /* ]] || exit 1
            [[ -n "$dockerfile" && "$dockerfile" != /* ]] || exit 1
            absolute_context=$(realpath -m "$GITHUB_WORKSPACE/deploy/$context")
            absolute_dockerfile=$(realpath -m "$absolute_context/$dockerfile")
            [[ "$absolute_context" == "$GITHUB_WORKSPACE/"* ]] || exit 1
            [[ "$absolute_dockerfile" == "$GITHUB_WORKSPACE/"* ]] || exit 1
            [[ -d "$absolute_context" && -f "$absolute_dockerfile" ]] || exit 1
          done < <(jq -c '.include[]' "$RUNNER_TEMP/build-matrix.json")
          echo "matrix=$(cat "$RUNNER_TEMP/build-matrix.json")" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.discover.outputs.registry_host }}
          username: ${{ inputs.push_username }}
          password: ${{ secrets.GIT_REGISTRY_TOKEN }}

      - name: Build and publish versioned image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/${{ matrix.context }}
          file: ./deploy/${{ matrix.context }}/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image_prefix }}-${{ matrix.service }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record image digest
        env:
          OCI_IMAGE_PREFIX: ${{ inputs.image_prefix }}
          IMAGE_SERVICE: ${{ matrix.service }}
          IMAGE_VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg service "$IMAGE_SERVICE" \
                --arg tag "$OCI_IMAGE_PREFIX-$IMAGE_SERVICE:$IMAGE_VERSION" \
                --arg digest "$OCI_IMAGE_PREFIX-$IMAGE_SERVICE@$IMAGE_DIGEST" \
                '{service: $service, tag: $tag, image: $digest}' > "$RUNNER_TEMP/image.json"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.json
          if-no-files-found: error
          retention-days: 30
