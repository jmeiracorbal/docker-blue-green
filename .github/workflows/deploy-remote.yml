name: Deploy Blue-Green release

on:
  workflow_call:
    inputs:
      version:
        description: Immutable release version
        required: true
        type: string
      source_ref:
        description: Git ref containing the deployment configuration
        required: true
        type: string
      engine_ref:
        description: Immutable Git revision of the Blue-Green CLI
        required: true
        type: string
    secrets:
      SERVER_SSH_PRIVATE_KEY:
        required: false
      OCI_REGISTRY_PULL_USERNAME:
        required: false
      OCI_REGISTRY_PULL_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: docker-blue-green-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.contract.outputs.enabled }}
      project: ${{ steps.contract.outputs.project }}
      host: ${{ steps.contract.outputs.host }}
      user: ${{ steps.contract.outputs.user }}
      port: ${{ steps.contract.outputs.port }}
      known_hosts: ${{ steps.contract.outputs.known_hosts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Determine deployment from the unified contract
        id: contract
        env:
          ENGINE_REF: ${{ inputs.engine_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENGINE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          go install "github.com/jmeiracorbal/docker-blue-green/cmd/bluegreen@$ENGINE_REF"
          "$(go env GOPATH)/bin/bluegreen" config export --dir . > "$RUNNER_TEMP/project.json"
          {
            echo "enabled=$(jq -er '.deployment.enabled' "$RUNNER_TEMP/project.json")"
            echo "project=$(jq -er '.project' "$RUNNER_TEMP/project.json")"
            if [[ "$(jq -r '.deployment.enabled' "$RUNNER_TEMP/project.json")" == "true" ]]; then
              echo "host=$(jq -er '.deployment.host' "$RUNNER_TEMP/project.json")"
              echo "user=$(jq -er '.deployment.user' "$RUNNER_TEMP/project.json")"
              echo "port=$(jq -er '.deployment.port' "$RUNNER_TEMP/project.json")"
              echo "known_hosts=$(jq -er '.deployment.known_hosts' "$RUNNER_TEMP/project.json")"
            fi
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: ${{ needs.plan.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download immutable image references
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: .bluegreen-dist/images

      - name: Build immutable deployment bundle
        env:
          DEPLOY_PROJECT: ${{ needs.plan.outputs.project }}
          DEPLOY_VERSION: ${{ inputs.version }}
          ENGINE_REF: ${{ inputs.engine_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PROJECT" =~ ^[a-z][a-z0-9_-]{0,62}$ ]] || exit 1
          [[ "$DEPLOY_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 1
          [[ "$ENGINE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go install "github.com/jmeiracorbal/docker-blue-green/cmd/bluegreen@$ENGINE_REF"
          cp "$(go env GOPATH)/bin/bluegreen" .bluegreen-dist/bluegreen
          .bluegreen-dist/bluegreen config export --dir . > .bluegreen-dist/project.json
          jq -e --arg project "$DEPLOY_PROJECT" '
            .project == $project and .deployment.enabled == true and
            (.routes | type == "array" and length > 0)
          ' .bluegreen-dist/project.json >/dev/null
          jq -s 'reduce .[] as $item ({}; .[$item.service] = $item.image)' \
            .bluegreen-dist/images/image-*/image.json > .bluegreen-dist/images.json
          jq -n --arg project "$DEPLOY_PROJECT" --arg version "$DEPLOY_VERSION" \
            --slurpfile images .bluegreen-dist/images.json \
            --slurpfile config .bluegreen-dist/project.json \
            '{project: $project, version: $version, images: $images[0], routes: $config[0].routes}' \
            > .bluegreen-dist/release.json
          jq -e '
            (.images | type == "object" and length > 0) and
            ([.images[] | (type == "string" and test("^[a-z0-9][a-z0-9.:-]*/[a-z0-9][a-z0-9/_.-]*@sha256:[a-f0-9]{64}$"))] | all)
          ' .bluegreen-dist/release.json >/dev/null
          registry_prefix=$(jq -er '.registry.host + "/" + .registry.repository + "-"' .bluegreen-dist/project.json)
          jq -e --arg prefix "$registry_prefix" '
            .images | to_entries | all(.[]; .value | startswith($prefix))
          ' .bluegreen-dist/release.json >/dev/null
          tar -czf .bluegreen-dist/deploy.tgz deploy

      - name: Configure verified SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ needs.plan.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/bluegreen"
          chmod 600 "$HOME/.ssh/bluegreen"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer and run deployment
        env:
          SSH_HOST: ${{ needs.plan.outputs.host }}
          SSH_USER: ${{ needs.plan.outputs.user }}
          SSH_PORT: ${{ needs.plan.outputs.port }}
          DEPLOY_PROJECT: ${{ needs.plan.outputs.project }}
          OCI_REGISTRY_PULL_USERNAME: ${{ secrets.OCI_REGISTRY_PULL_USERNAME }}
          OCI_REGISTRY_PULL_TOKEN: ${{ secrets.OCI_REGISTRY_PULL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$OCI_REGISTRY_PULL_USERNAME" || -n "$OCI_REGISTRY_PULL_TOKEN" ]]; then
            [[ -n "$OCI_REGISTRY_PULL_USERNAME" && -n "$OCI_REGISTRY_PULL_TOKEN" ]] || { echo "Both OCI pull credentials are required for private images" >&2; exit 1; }
            [[ "$OCI_REGISTRY_PULL_USERNAME" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "Invalid OCI pull username" >&2; exit 1; }
          fi
          registry_host=$(jq -er '
            [.images[] | strings | split("/")[0]] | unique |
            if length == 1 then .[0] else error("Release must contain images from one OCI registry") end
          ' .bluegreen-dist/release.json)
          [[ "$registry_host" =~ ^[a-z0-9][a-z0-9.:-]*$ && ( "$registry_host" == *.* || "$registry_host" == *:* || "$registry_host" == "localhost" ) ]] || { echo "Invalid OCI registry host in release manifest" >&2; exit 1; }
          remote_dir=".local/share/docker-blue-green/$DEPLOY_PROJECT"
          ssh -i "$HOME/.ssh/bluegreen" -o StrictHostKeyChecking=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "install -d -m 700 '$remote_dir/.incoming'"
          scp -i "$HOME/.ssh/bluegreen" -o StrictHostKeyChecking=yes -P "$SSH_PORT" \
            .bluegreen-dist/deploy.tgz .bluegreen-dist/bluegreen \
            .bluegreen-dist/release.json \
            "$SSH_USER@$SSH_HOST:$remote_dir/.incoming/"
          if [[ -n "$OCI_REGISTRY_PULL_TOKEN" ]]; then
            printf '%s' "$OCI_REGISTRY_PULL_TOKEN" | \
              ssh -i "$HOME/.ssh/bluegreen" -o StrictHostKeyChecking=yes -p "$SSH_PORT" \
                "$SSH_USER@$SSH_HOST" \
                "cd '$remote_dir' && install -d -m 700 .registry && DOCKER_CONFIG=\$PWD/.registry docker login '$registry_host' --username '$OCI_REGISTRY_PULL_USERNAME' --password-stdin"
          fi
          ssh -i "$HOME/.ssh/bluegreen" -o StrictHostKeyChecking=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$remote_dir' && umask 077 && tar -xzf .incoming/deploy.tgz && install -m 700 .incoming/bluegreen ./bluegreen && test -f .env && install -m 600 .incoming/release.json ./release.json && DOCKER_CONFIG=\$PWD/.registry ./bluegreen deploy --dir . --release release.json --env-file .env"

      - name: Remove temporary remote credentials
        if: always()
        env:
          SSH_HOST: ${{ needs.plan.outputs.host }}
          SSH_USER: ${{ needs.plan.outputs.user }}
          SSH_PORT: ${{ needs.plan.outputs.port }}
          DEPLOY_PROJECT: ${{ needs.plan.outputs.project }}
        shell: bash
        run: |
          if [[ -f "$HOME/.ssh/bluegreen" ]]; then
            ssh -i "$HOME/.ssh/bluegreen" -o StrictHostKeyChecking=yes -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "cd '.local/share/docker-blue-green/$DEPLOY_PROJECT' && rm -f .incoming/deploy.tgz .incoming/bluegreen .incoming/release.json && rm -rf .registry" || true
          fi
